services:
  postgres:
    image: postgres:16
    container_name: aikichun-postgres
    ports:
      - "5402:5432"
    environment:
      POSTGRES_DB: aikichun_db
      POSTGRES_USER: aikichun_admin
      POSTGRES_PASSWORD: aikichun_360!
    volumes:
      - aikichun_pgdata:/var/lib/postgresql/data
    #restart: unless-stopped

volumes:
  aikichun_pgdata:

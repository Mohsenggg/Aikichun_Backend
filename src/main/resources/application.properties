# ===================================================================
# Aikichun Backend — Shared Configuration
# ===================================================================
spring.application.name=aikichun-backend

# Default profile when none is explicitly specified (e.g. local dev)
spring.profiles.default=dev

# Server Port (Railway binds dynamically via $PORT, defaults to 8080 locally)
server.port=${PORT:8080}

# ===================================================================
# Flyway Migrations (Shared)
# ===================================================================
spring.flyway.locations=classpath:db/migration

# ===================================================================
# JPA / Hibernate (Shared)
# ===================================================================
spring.jpa.open-in-view=false

# ===================================================================
# Multipart File Upload Limits (Shared)
# ===================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# Storage & Uploads (Shared default)
# ===================================================================
aikichun.storage.upload-dir=${UPLOAD_DIR:./uploads}

# ===================================================================
# OTP Defaults (Shared default)
# ===================================================================
aikichun.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}

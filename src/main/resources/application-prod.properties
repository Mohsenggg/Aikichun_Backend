# ===================================================================
# Aikichun Backend — Railway Production Configuration
# Target: Railway Cloud Deployment (Railway PostgreSQL)
# ===================================================================

# -------------------------------------------------------------------
# Database Configuration (Railway PostgreSQL)
# Supports standard SPRING_DATASOURCE_* vars or Railway PG* vars
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# HikariCP Connection Pool (Optimized for Cloud Deployment)
# -------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# -------------------------------------------------------------------
# JPA / Hibernate (Production Settings)
# Avoid automatic schema changes (validate only against Flyway schema)
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# -------------------------------------------------------------------
# Flyway Migrations (Production)
# -------------------------------------------------------------------
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

# -------------------------------------------------------------------
# JWT & Security Configuration (Loaded via Environment Variables)
# -------------------------------------------------------------------
aikichun.jwt.secret=${AIKICHUN_JWT_SECRET:${JWT_SECRET}}
aikichun.jwt.expiration-hours=${AIKICHUN_JWT_EXPIRATION_HOURS:${JWT_EXPIRATION_HOURS:12}}

# -------------------------------------------------------------------
# Mail / SMTP Configuration
# -------------------------------------------------------------------
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# -------------------------------------------------------------------
# OTP & Email Defaults
# -------------------------------------------------------------------
aikichun.otp.email.from-email=${SMTP_FROM_EMAIL:noreply@aikichun.com}
aikichun.otp.email.from-name=${SMTP_FROM_NAME:AIKICHUN MMA}

# -------------------------------------------------------------------
# CORS Settings
# -------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://aikichun-progress.web.app,https://aikichun-progress.firebaseapp.com,http://localhost:4200}

# -------------------------------------------------------------------
# Logging (Production level)
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.aikichun=INFO


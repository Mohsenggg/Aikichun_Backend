# ===================================================================
# Aikichun Backend — Local Development Configuration
# Target: Local PostgreSQL on Windows (port 5432)
# ===================================================================

# -------------------------------------------------------------------
# Database Configuration (Local PostgreSQL)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/aikichun_db
spring.datasource.username=postgres
spring.datasource.password=9268
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# Flyway Migrations
# -------------------------------------------------------------------
spring.flyway.enabled=true

# -------------------------------------------------------------------
# Mail / SMTP Configuration
# -------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# -------------------------------------------------------------------
# JWT & Security Configuration
# -------------------------------------------------------------------
aikichun.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
aikichun.jwt.expiration-hours=12

# -------------------------------------------------------------------
# OTP & Email Defaults
# -------------------------------------------------------------------
aikichun.otp.email.from-email=noreply@aikichun.com
aikichun.otp.email.from-name=AIKICHUN MMA

# -------------------------------------------------------------------
# CORS Settings
# -------------------------------------------------------------------
cors.allowed-origins=http://localhost:4200

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.aikichun=DEBUG

